# Site statique : aucune étape de build, Netlify publie le dossier tel quel.
[build]
  publish = "."

# Le site ne doit pas être référencé par les moteurs de recherche.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    # OpenStreetMap exige un Referer : on envoie seulement l'adresse du site, sans le chemin.
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# Le service worker et les données doivent toujours être relus pour voir les mises à jour.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
